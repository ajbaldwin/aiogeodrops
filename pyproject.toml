[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aiogeodrops"
version = "0.1.1"
description = "Async client for GeoDrops soil-probe readings in Google BigQuery"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adam Baldwin" }]
requires-python = ">=3.13"
dependencies = [
  "aiohttp>=3.9",
  "PyJWT[crypto]>=2.8",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Home Automation",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15",
  "pytest>=8",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6",
  "ruff>=0.11",
]

[project.urls]
Homepage = "https://github.com/ajbaldwin/aiogeodrops"
Issues = "https://github.com/ajbaldwin/aiogeodrops/issues"
Changelog = "https://github.com/ajbaldwin/aiogeodrops/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["ASYNC", "B", "D", "E", "F", "I", "PL", "RUF", "SIM", "TRY", "UP", "W"]
ignore = [
  "D203",    # one-blank-line-before-class conflicts with D211
  "D213",    # multi-line summary on the first line (D212)
  "PLR2004", # HTTP status codes read better inline
  "TRY003",  # exception messages carry the API's error text
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["aiogeodrops"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR0913", "PLR2004"]
